<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClaroFin - Estado de Solicitudes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/estado.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script defer src="js/navbar.js"></script>
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/logo.png" alt="Logo ClaroFin" class="logo">
            </a>
            <nav class="nav-links" id="navLinks" data-open="false">
                <a href="infoseguros.html">SEGUROS</a>
                <a href="infocreditos.html">CRÉDITOS</a>
                <a href="infocontacto.html">CONTACTO</a>
            </nav>

            <button class="burger" aria-label="Abrir menú" aria-expanded="false">☰</button>
            <a href="acceso.html" class="acceso" id="accesoBtn">ACCESO</a>
            <div class="profile" id="profileMenu">
                <img src="assets/profile.jpg" alt="Perfil" id="profileBtn" class="profile-icon">
                <div class="dropdown" id="dropdownMenu">
                    <button id="logoutBtn">Cerrar sesión</button>
                    <button id="pagosbtn">Pagos cuotas</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="estado-wrapper">
            <h1>Estado de mis Solicitudes</h1>
            <p class="subtitulo">Consulta el estado actual de todas tus solicitudes de crédito.</p>

            <!-- Tabs -->
            <div class="estado-tabs">
                <button class="estado-tab active" data-tab="pendientes">Pendientes</button>
                <button class="estado-tab" data-tab="sin-firmar">Aprobadas — Pendientes de Firma</button>
                <button class="estado-tab" data-tab="firmadas">Aprobadas y Firmadas</button>
            </div>

            <!-- Panel: Pendientes -->
            <div class="estado-panel active" id="panel-pendientes">
                <div id="contenido-pendientes"></div>
            </div>

            <!-- Panel: Sin firmar -->
            <div class="estado-panel" id="panel-sin-firmar">
                <div id="contenido-sin-firmar"></div>
            </div>

            <!-- Panel: Firmadas -->
            <div class="estado-panel" id="panel-firmadas">
                <div id="contenido-firmadas"></div>
            </div>
        </div>
    </main>

    <!-- Modal de confirmación -->
    <div class="modal-overlay" id="modalFirma">
        <div class="modal-box">
            <div class="modal-icon">✍️</div>
            <h3>Firmar Solicitud</h3>
            <p>Al firmar aceptas los términos y condiciones del crédito aprobado.<br>Esta acción no se puede deshacer.</p>
            
            <div class="campo" style="margin: 15px 0; text-align: left;">
                <label for="documentoFirma" style="font-weight: bold; display: block; margin-bottom: 5px; color: #343838; font-size: 14px;">Sube la foto de tu carnet para validar tu identidad:</label>
                <input type="file" id="documentoFirma" accept="image/png, image/jpeg" style="width: 100%; padding: 8px; border: 1px solid #2B4C7E; border-radius: 4px; box-sizing: border-box;">
                <p id="msgFirmaOcr" style="font-size: 0.9em; margin-top: 5px; color: #7f7f7f;"></p>
            </div>

            <div class="modal-actions">
                <button class="modal-btn-cancel" id="modalCancelar">Cancelar</button>
                <button class="modal-btn-confirm" id="modalConfirmar">Firmar</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toastFirma">✅ Solicitud firmada exitosamente</div>

    <script defer src="js/main.js"></script>
    <script defer src="js/estado.js"></script>
</body>
</html>
