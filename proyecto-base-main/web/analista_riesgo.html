<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analista de Riesgo</title>
    <link rel="stylesheet" href="css/analista.css" />
  </head>

  <body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/logo.png" alt="Logo ClaroFin" class="logo">
            </a>

            <nav class="nav-links" id="navLinks" data-open="false">
                <a href="#seguros">SEGUROS</a>
                <a href="#creditos">CRÉDITOS</a>
                <a href="#contacto">CONTACTO</a>
            </nav>

            <div class="profile" id="profileMenu">
                <img src="assets/profile.jpg" alt="Perfil" id="profileBtn" class="profile-icon">              
            </div>
        </div>
    </header>

    <main class="container" id="content">
      <section>
        <h1>Analista de Riesgo</h1>
        <div class="tabs">
          <button class="tab-button active" data-tab="evaluacion">Evaluación de Riesgo</button>
          <button class="tab-button" data-tab="aprobadas">Solicitudes Aprobadas</button>
          <button class="tab-button" data-tab="sin-firmar">Solicitudes sin Firmar</button>
        </div>

        <div id="evaluacion" class="tab-content active">
          <h2>Solicitudes de Crédito para Evaluación</h2>
          <div id="evaluacion-content"></div>
        </div>

        <div id="aprobadas" class="tab-content">
          <h2>Solicitudes Aprobadas</h2>
          <div id="aprobadas-content"></div>
        </div>

        <div id="sin-firmar" class="tab-content">
          <h2>Solicitudes sin Firmar</h2>
          <div id="sin-firmar-content"></div>
        </div>
      </section>
    </main>

    <script defer src="js/navbar.js"></script>
    <script defer src="js/analista_riesgo.js"></script>
  </body>
</html>
