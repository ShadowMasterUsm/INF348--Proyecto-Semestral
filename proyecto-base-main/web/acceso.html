<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ClaroFin - Acceso</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }
        .navbar {
            background-color: #0073e6;
            padding: 10px 20px;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .brand .logo {
            height: 40px;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px);
        }
        .login-container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
        }
        .btn {
            font-size: 1.1rem;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #ccc;
            color: #333;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #bbb;
        }
        .btn.primary {
            background-color: #0073e6;
            color: white;
        }
        .btn.primary:hover {
            background-color: #005bb5;
        }
    </style>

    <script defer src="js/navbar.js"></script>
    <script defer src="js/main.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/logo.png" alt="Logo ClaroFin" class="logo" />
            </a>
        </div>
    </header>

    <main>
        <div class="login-container">
            <button class="btn" id="analistaBtn">SOY ANALISTA</button>
            <button class="btn primary" id="clienteBtn">SOY CLIENTE</button>
        </div>
    </main>
</body>
</html>
