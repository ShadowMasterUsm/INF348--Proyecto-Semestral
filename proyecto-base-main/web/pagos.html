<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClaroFin - Pago de Cuotas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/pagos.css">
    <script defer src="js/navbar.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/pagos.js"></script>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/logo.png" alt="Logo ClaroFin" class="logo">
            </a>
            <nav class="nav-links" id="navLinks" data-open="false">
                <a href="infoseguros.html">SEGUROS</a>
                <a href="infocreditos.html">CRÉDITOS</a>
                <a href="infocontacto.html">CONTACTO</a>
            </nav>

            <button class="burger" aria-label="Abrir menú" aria-expanded="false">☰</button>
            <a href="acceso.html" class="acceso" id="accesoBtn">ACCESO</a>
            <div class="profile" id="profileMenu">
                <img src="assets/profile.jpg" alt="Perfil" id="profileBtn" class="profile-icon">
                <div class="dropdown" id="dropdownMenu">
                    <button id="logoutBtn">Cerrar sesión</button>
                    <button id="estUSU">Estado solicitudes</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="pagos-wrapper">
            <h1>Pago de Cuotas</h1>
            <p class="subtitulo">Aquí puedes revisar y pagar las cuotas de tus créditos aprobados.</p>

            <div id="pagos-contenedor">
                <p class="cargando">Cargando créditos...</p>
            </div>
        </div>
    </main>

    <!-- Modal de confirmación de pago -->
    <div class="modal-overlay" id="modal-pago">
        <div class="modal-box">
            <div class="modal-icon">💳</div>
            <h3>Confirmar pago</h3>
            <p id="modal-detalle"></p>
            <p class="modal-aviso">Esta acción registrará la cuota como pagada y no se puede deshacer.</p>
            <div class="modal-actions">
                <button class="modal-btn-cancel" id="modal-cancelar">Cancelar</button>
                <button class="modal-btn-confirm" id="modal-confirmar">Confirmar pago</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast-pagos"></div>

</body>
</html>
